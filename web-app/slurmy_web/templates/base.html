<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Slurmy{% endblock %} · Local Workspace</title>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='workflows.css') }}">
  <script src="{{ url_for('static', filename='shell.js') }}" defer></script>
  <script src="{{ url_for('static', filename='pie-tooltip.js') }}" defer></script>
  <script src="{{ url_for('static', filename='dialog.js') }}" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body data-host="{{ host }}" {% block data %}{% endblock %}>
<aside class="sidebar">
  <a class="brand" href="{{ url_for('index', host=host) }}"><img src="/logo.svg" alt="">Slurmy<span>LOCAL WORKSPACE</span></a>
  <nav aria-label="Main navigation">
    <a href="{{ url_for('new', host=host) }}" {% if request.path == '/new' %}aria-current="page"{% endif %}>＋ <span>New Workflow</span></a>
    <a href="{{ url_for('workflow_list', host=host) }}" {% if request.path.startswith('/workflow') %}aria-current="page"{% endif %}>▤ <span>Workflows</span></a>
    <a href="{{ url_for('index', host=host) }}" {% if request.path == '/' or request.path.startswith('/jobs/') %}aria-current="page"{% endif %}>◫ <span>Job History</span></a>
    <a href="{{ url_for('cluster_page', host=host) }}" {% if request.path == '/cluster' %}aria-current="page"{% endif %}><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="5" rx="1.2"/><rect x="3" y="10" width="18" height="5" rx="1.2"/><rect x="3" y="17" width="18" height="5" rx="1.2"/><circle cx="6.5" cy="5.5" r="0.7" fill="currentColor" stroke="none"/><circle cx="6.5" cy="12.5" r="0.7" fill="currentColor" stroke="none"/><circle cx="6.5" cy="19.5" r="0.7" fill="currentColor" stroke="none"/><path d="M10 5.5h8m-8 7h8m-8 7h8"/></svg><span>Cluster Status</span></a>
  </nav>
  <div class="sidebar-footer">
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"><span aria-hidden="true">◐</span> <span>Dark mode</span></button>
    <a class="github-link" href="https://github.com/jackeown/Slurmy" target="_blank" rel="noopener noreferrer" aria-label="Slurmy on GitHub" title="Slurmy on GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.64 1.22 3.28.93.1-.73.4-1.22.72-1.5-2.5-.29-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.63 0c2.15-1.46 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.64 5.27-5.15 5.55.4.35.76 1.04.76 2.1v3.1c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg></a>
  </div>
</aside>
<main>
  <header class="topbar"><div class="topbar-title">{% block page_heading %}<h1>Slurmy</h1>{% endblock %}</div>
    <form id="host-form"><label for="host">SSH host</label><input id="host" name="host" value="{{ host }}" required pattern="[A-Za-z0-9][A-Za-z0-9_.-]*"><button class="secondary">Connect</button></form>
  </header>
  <div class="page">{% block content %}{% endblock %}</div>
  <section id="operation" class="operation" hidden aria-live="polite"><div class="section-heading"><h3 id="operation-title">Operation</h3><button id="dismiss-operation" class="secondary">Hide</button></div><pre id="operation-log"></pre></section>
  <div id="notice" role="status" hidden></div>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="app-dialog-title" aria-describedby="app-dialog-message">
    <form novalidate>
      <div class="app-dialog-heading"><span class="app-dialog-mark" aria-hidden="true">◇</span><button id="app-dialog-close" type="button" class="secondary" aria-label="Close dialog">✕</button></div>
      <h2 id="app-dialog-title"></h2><p id="app-dialog-message" class="muted"></p>
      <div id="app-dialog-field" hidden><label for="app-dialog-input" id="app-dialog-input-label">Name</label><input id="app-dialog-input" type="text" autocomplete="off" aria-describedby="app-dialog-error"><p id="app-dialog-error" class="error" role="alert" hidden></p></div>
      <label id="app-dialog-remember-field" class="dialog-remember" hidden><input id="app-dialog-remember" type="checkbox"><span>Remember this choice for 5 minutes</span></label>
      <div class="app-dialog-footer"><button id="app-dialog-cancel" type="button" class="secondary">Cancel</button><div id="app-dialog-actions"></div></div>
    </form>
  </dialog>
  <dialog id="path-browser"><form method="dialog" class="path-browser"><div class="section-heading"><h2>Choose a Local Path</h2><button value="cancel" class="secondary">Close</button></div><div class="path-location"><button id="path-parent" type="button" class="secondary">↑ Parent</button><div class="path-combobox"><input id="path-location" aria-label="Current directory" aria-controls="path-ancestors" aria-expanded="false"><button id="path-ancestors-toggle" type="button" aria-label="Show parent directories" aria-expanded="false" aria-controls="path-ancestors">▾</button><div id="path-ancestors" class="path-ancestors" hidden></div></div><button id="path-go" type="button" class="secondary">Go</button></div><div id="path-items" class="path-items"></div><p id="path-help" class="muted"></p><div class="wizard-actions"><button id="path-select-directory" type="button" class="secondary">Choose this directory</button><span></span><button value="cancel" class="secondary">Cancel</button></div></form></dialog>
</main>
</body></html>
