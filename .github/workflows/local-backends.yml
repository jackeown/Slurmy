name: Local backends
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Native execution and portable limits
        run: |
          python -m unittest discover -s web-app/tests -p 'test_local_backend.py'
          python -m unittest discover -s implementation/tests -p 'test_portable_runtime.py'
